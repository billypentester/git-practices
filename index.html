<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Practice</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Git</h1>
        </div>
        <div class="history">
            <div class="history-card">
                <h2>Feature A</h2>
                <p>Feature development of feature A</p>
            </div>
            <div class="history-card">
                <h2>Feature A-1</h2>
                <p>Feature fixes of feature A</p>
            </div>
            <div class="history-card">
                <h2>Feature A-2</h2>
                <p>Feature wrap up of feature A</p>
            </div>
            <div class="history-card">
                <h2>Feature B</h2>
                <p>Feature wrap up of feature B</p>
            </div>
            <div class="history-card">
                <h2>Feature B-2</h2>
                <p>Requirement Updated</p>
            </div>
            <div class="history-card">
                <h2>Feature B-2</h2>
                <p>Fixes + Revamp of feature</p>
            </div>
        </div>
    </div>
</body>
</html>
